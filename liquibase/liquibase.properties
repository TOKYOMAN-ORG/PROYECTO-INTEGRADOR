# Configuración de Liquibase sin credenciales.
# URL, usuario y contraseña llegan por las variables LIQUIBASE_COMMAND_URL, LIQUIBASE_COMMAND_USERNAME
# y LIQUIBASE_COMMAND_PASSWORD que define docker/docker-compose.yml a partir del .env de la raíz.
changeLogFile=changelog/db.changelog-master.yaml
searchPath=/liquibase/project
# Mismo valor que el archivo por defecto de la imagen oficial, que este archivo reemplaza.
liquibase.headless=true
